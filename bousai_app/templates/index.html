{% extends "base.html" %}

{% block content %}
<div class="map-section panel">
  <div class="map-title">
    <span class="map-pin" aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 2.5c-3.86 0-7 3.14-7 7 0 5.18 7 12.5 7 12.5s7-7.32 7-12.5c0-3.86-3.14-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="currentColor"/>
      </svg>
    </span>
    <span>避難所マップ</span>
  </div>
  <div id="shelterMap" aria-label="避難所マップ"></div>
</div>

<div class="weather-panel">
  <div class="weather-header">
    <div class="weather-title">
      <span class="weather-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="8" r="3.5" fill="currentColor" stroke="none"/>
            <path d="M7 17.5c0-2.2 1.8-4 4-4s4 1.8 4 4"/>
            <path d="M17 16.5c1.4 0 2.5-1.1 2.5-2.5S18.4 11.5 17 11.5c-.2-1.9-1.7-3.4-3.6-3.4-1.8 0-3.3 1.3-3.5 3.1A2.7 2.7 0 0 0 9 13.5c0 1.5 1.2 2.7 2.7 2.7h5.3z"/>
          </g>
        </svg>
      </span>
      <span>青森市 気象警報・注意報</span>
    </div>
    <button class="refresh-button" type="button" aria-label="更新する">
      <span class="refresh-icon" aria-hidden="true"></span>
      <span>10分おき自動更新</span>
    </button>
  </div>

  <div class="weather-body" id="weatherContent">
    <div class="weather-row">
      <span class="weather-dot" aria-hidden="true"></span>
      <span>青森市</span>
    </div>
    <div class="weather-row">
      <span class="weather-dot" aria-hidden="true"></span>
      <span>現在、警報・注意報は発表されていません</span>
    </div>
    <div class="weather-meta">
      <div>◌ データ取得: 2025年06月05日 11:56</div>
      <div>◌ 気象庁発表: 2025年06月04日 21:18</div>
    </div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap', {
        zoomControl: true,
        attributionControl: false
    }).setView([40.8244, 140.7400], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                updateWeatherContent(data);
            })
            .catch(() => {
                document.getElementById('weatherContent').innerHTML = `
                    <div class="weather-row">
                        <span class="weather-dot" aria-hidden="true"></span>
                        <span>現在、警報・注意報は発表されていません</span>
                    </div>
                    <div class="weather-meta">
                        <div>◌ 気象情報の取得に失敗しました</div>
                    </div>
                `;
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = `
                <div class="weather-row">
                    <span class="weather-dot" aria-hidden="true"></span>
                    <span>青森市</span>
                </div>
                <div class="weather-row">
                    <span class="weather-dot" aria-hidden="true"></span>
                    <span>現在、警報・注意報は発表されていません</span>
                </div>
                <div class="weather-meta">
                    <div>◌ データ取得: ${data.last_fetch_time || '更新中...'}</div>
                    <div>◌ 気象庁発表: ${data.report_time || '不明'}</div>
                </div>
            `;
            return;
        }

        const warnings = data.warnings && data.warnings.length > 0
            ? data.warnings.map(item => `${item.name}（${item.status}）`).join('、')
            : '現在、警報・注意報は発表されていません';

        weatherContent.innerHTML = `
            <div class="weather-row">
                <span class="weather-dot" aria-hidden="true"></span>
                <span>${data.area_name || '青森市'}</span>
            </div>
            <div class="weather-row">
                <span class="weather-dot" aria-hidden="true"></span>
                <span>${warnings}</span>
            </div>
            <div class="weather-meta">
                <div>◌ データ取得: ${data.last_fetch_time || '更新中...'}</div>
                <div>◌ 気象庁発表: ${data.report_time || '不明'}</div>
            </div>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
