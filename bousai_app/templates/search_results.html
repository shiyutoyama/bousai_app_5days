{% extends "base.html" %}

{% block content %}
<style>
  body {
    background: #d9d9d9;
    margin: 0;
    font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
  }

  .search-page {
    width: 100%;
    min-height: 100vh;
    background: #d9d9d9;
    padding: 0;
    box-sizing: border-box;
  }

  .result-header {
    background: #d0d0d0;
    border-top: 2px solid #6e6e6e;
    border-bottom: 2px solid #6e6e6e;
    padding: 10px 18px 12px;
    font-size: 20px;
    font-weight: 700;
    color: #111;
    margin: 0 0 16px;
  }

  .result-header .title {
    display: inline-block;
    color: #c81919;
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 2px;
    line-height: 1.4;
  }

  .top-menu {
    display: grid;
    grid-template-columns: repeat(4, minmax(200px, 1fr));
    gap: 0;
    margin: 0 0 18px;
    padding: 0 24px;
  }

  .menu-box {
    border: 2px solid #444;
    background: rgba(255,255,255,0.18);
    min-height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    font-weight: 500;
    color: #111;
    margin: 0 10px 0 0;
    box-sizing: border-box;
  }

  .menu-box.active {
    background: rgba(176, 214, 235, 0.8);
  }

  .content-grid {
    display: grid;
    grid-template-columns: 1.05fr 1.35fr;
    gap: 20px;
    padding: 0 24px;
    align-items: stretch;
  }

  .info-box {
    height: 240px;
    border: 2px solid #444;
    background: rgba(255,255,255,0.12);
    position: relative;
    overflow: hidden;
    box-sizing: border-box;
  }

  #searchMap {
    width: 100%;
    height: 100%;
    background: #dfeef7;
  }

  .detail-box {
    border: 3px solid #111;
    border-radius: 26px;
    background: rgba(255,255,255,0.08);
    min-height: 240px;
    position: relative;
    padding: 22px 26px 18px;
    box-sizing: border-box;
  }

  .update-button {
    position: absolute;
    top: 18px;
    right: 20px;
    border: 2px solid #444;
    background: rgba(255,255,255,0.18);
    padding: 8px 18px;
    font-size: 18px;
    cursor: pointer;
  }

  .detail-box h3 {
    margin: 34px 0 20px;
    font-size: 22px;
    line-height: 1.4;
    font-weight: 700;
    color: #111;
  }

  .detail-box .panel-box {
    width: 100%;
    height: 118px;
    border: 3px solid #111;
    border-radius: 18px;
    background: rgba(255,255,255,0.05);
    margin-top: 12px;
  }

  .proposal-area {
    margin-top: 28px;
    border-top: 2px solid #333;
    border-bottom: 2px solid #333;
    padding: 0;
  }

  .proposal-header {
    font-size: 22px;
    font-weight: 700;
    color: #111;
    padding: 12px 18px 10px;
  }

  .proposal-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 18px 12px;
    gap: 18px;
  }

  .proposal-box {
    display: flex;
    align-items: center;
    width: 100%;
  }

  .proposal-box.left {
    justify-content: flex-start;
  }

  .proposal-box.right {
    justify-content: flex-end;
  }

  .proposal-main {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 140px;
    border: 2px solid #111;
    background: rgba(255,255,255,0.08);
    box-sizing: border-box;
    padding: 12px 18px;
    margin-right: 10px;
    position: relative;
  }

  .proposal-main .text {
    font-size: 18px;
    font-weight: 700;
    text-align: left;
    margin-bottom: 10px;
  }

  .proposal-main .arrow {
    position: absolute;
    right: 18px;
    width: 38px;
    height: 38px;
    border: 3px solid #111;
    border-left: none;
    border-top: none;
    transform: rotate(-45deg);
    margin-left: auto;
  }

  .proposal-small {
    width: 100px;
    height: 100px;
    border: 2px solid #111;
    background: rgba(255,255,255,0.08);
    margin-left: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .proposal-small.long {
    width: 150px;
  }

  .candidate-icons {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 6px;
  }

  .icon-tile {
    width: 64px;
    height: 64px;
    border: 2px solid #111;
    background: rgba(255,255,255,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-sizing: border-box;
  }

  .icon-tile.small {
    width: 52px;
    height: 52px;
    font-size: 22px;
  }

  .bar-block {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    font-size: 18px;
    font-weight: 700;
  }

  .bar-wrap {
    width: 180px;
    height: 22px;
    border: 2px solid #111;
    background: #f3f3f3;
    position: relative;
    overflow: hidden;
  }

  .bar-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 70%;
    background: #f1c54d;
  }

  .bar-percent {
    min-width: 58px;
    text-align: left;
    font-size: 18px;
  }

  @media (max-width: 900px) {
    .top-menu {
      grid-template-columns: repeat(2, minmax(180px, 1fr));
    }

    .content-grid {
      grid-template-columns: 1fr;
    }

    .proposal-row {
      flex-direction: column;
      align-items: stretch;
    }
  }
</style>

<div class="search-page">
  <div class="result-header">
    <span class="title">避難所検索結果（システム名）</span>
  </div>

  <div class="top-menu">
    <div class="menu-box active">ホーム</div>
    <div class="menu-box">避難所検索</div>
    <div class="menu-box">避難所登録</div>
    <div class="menu-box">指示ボード</div>
  </div>

  <div class="content-grid">
    <div class="info-box">
      <div id="searchMap" aria-label="避難所と現在位置の地図"></div>
    </div>

    <div class="detail-box">
      <button class="update-button" type="button">情報更新ボタン</button>
      <h3>選択された際に詳しい情報</h3>
      <div class="panel-box"></div>
    </div>
  </div>

  <div class="proposal-area">
    <div class="proposal-header">提案先①</div>
    <div class="proposal-row">
      <div class="proposal-box left">
        <div class="proposal-main">
          <div>
            <div class="text">避難所候補</div>
            <div class="candidate-icons">
              <div class="icon-tile small">👥</div>
              <div class="icon-tile small">🖼️</div>
              <div class="icon-tile small">🏫</div>
            </div>
            <div class="bar-block">
              <div class="bar-wrap">
                <div class="bar-fill"></div>
              </div>
              <div class="bar-percent">（70%）</div>
            </div>
          </div>
          <div class="arrow"></div>
        </div>
        <div class="proposal-small">🏠</div>
      </div>

      <div class="proposal-box right">
        <div class="proposal-small long">📍</div>
        <div class="proposal-main">
          <div>
            <div class="text">避難所候補</div>
            <div class="candidate-icons">
              <div class="icon-tile small">👥</div>
              <div class="icon-tile small">🖼️</div>
              <div class="icon-tile small">🏫</div>
            </div>
            <div class="bar-block">
              <div class="bar-wrap">
                <div class="bar-fill" style="width: 60%;"></div>
              </div>
              <div class="bar-percent">（60%）</div>
            </div>
          </div>
          <div class="arrow" style="transform: rotate(135deg); right: auto; left: 18px;"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="proposal-header" style="border-top: 2px solid #333;">提案先②</div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const defaultCenter = [40.8244, 140.7400];
  const map = L.map('searchMap', {
    zoomControl: true,
    attributionControl: false
  }).setView(defaultCenter, 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    noWrap: true
  }).addTo(map);

  const shelterLocations = {
    '御所見小学校': [40.8244, 140.7400],
    '片瀬小学校': [40.8320, 140.7260],
    '鵠洋小学校': [40.8100, 140.7080],
    'あああ': [40.8390, 140.7500],
    '梅田ビル': [40.8180, 140.7640]
  };

  const shelterData = {{ results|tojson|safe }};
  shelterData.forEach(function(shelter) {
    const coords = shelterLocations[shelter.name] || defaultCenter;
    const marker = L.circleMarker(coords, {
      radius: 8,
      color: '#0d6efd',
      fillColor: '#2a9df4',
      fillOpacity: 0.85,
      weight: 2
    }).addTo(map);

    marker.bindPopup(shelter.name);
  });

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      const current = [position.coords.latitude, position.coords.longitude];
      map.setView(current, 14);
      L.circleMarker(current, {
        radius: 10,
        color: '#d62828',
        fillColor: '#ff4d4d',
        fillOpacity: 0.9,
        weight: 3
      }).addTo(map).bindPopup('現在地');
    }, function() {
      const current = defaultCenter;
      L.circleMarker(current, {
        radius: 10,
        color: '#d62828',
        fillColor: '#ff4d4d',
        fillOpacity: 0.9,
        weight: 3
      }).addTo(map).bindPopup('現在地（デフォルト位置）');
    });
  } else {
    L.circleMarker(defaultCenter, {
      radius: 10,
      color: '#d62828',
      fillColor: '#ff4d4d',
      fillOpacity: 0.9,
      weight: 3
    }).addTo(map).bindPopup('現在地（デフォルト位置）');
  }
});
</script>
{% endblock %}
